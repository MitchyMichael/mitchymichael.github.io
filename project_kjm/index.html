        <!-- Animate hero -->
        <script>
            document.addEventListener('DOMContentLoaded', function () {
            const images = [
                "https://kawijayamakmoer.com/public/img/banner/banner_home1.jpg",
                "https://kawijayamakmoer.com/public/img/banner/banner_home2.jpg",
                "https://kawijayamakmoer.com/public/img/banner/banner_home3.jpg"
            ];

            // pastikan elemen ada
            const bgDiv = document.getElementById("bg-slider");
            if (!bgDiv) return;

            // preload agar cepat muncul
            images.forEach(src => { const img = new Image(); img.src = src; });

            // set gambar awal (biar tidak blank)
            let index = 0;
            bgDiv.style.backgroundImage = `url('${images[index]}')`;

            // ganti tiap 5 detik (catatan: 5000ms = 5 detik, bukan 1 detik)
            setInterval(() => {
                index = (index + 1) % images.length;
                bgDiv.style.backgroundImage = `url('${images[index]}')`;
            }, 3000);
            });
        </script>

        <!-- Animate on Scroll -->
