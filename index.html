<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michael's Github Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-black text-white font-sans">
    <!-- Bagian iframe (background tetap) -->
    <div class="fixed inset-0 -z-10">
      <iframe
        id="spline"
        class="w-full h-full"
        src="https://my.spline.design/clonercubebinarycopy-TJrBfsRwVaCjQdLwq6nzezH5/"
        frameborder="0"
        width="100%"
        height="100%">
      </iframe>
      <!-- Shield opsional agar tidak bisa zoom saat scroll -->
      <div id="scrollShield" class="absolute inset-0 bg-transparent"></div>
    </div>

    <!-- Konten halaman -->
    <section class="h-[100vh] flex items-center justify-center">
      <h1 class="text-4xl font-bold">Hello</h1>
    </section>

    <section class="h-[1000px] w-full bg-black flex items-center justify-center">
      <p>Scroll down — background stays fixed.</p>
    </section>
  </body>
</html>
